name: Publish BQ SQWAD TV FFmpeg worker image

on:
  # Manual only: publishing an image must never start an unattended runtime.
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Optional image tag (defaults to the short commit SHA)"
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish-worker:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main commit
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image tags
        id: meta
        shell: bash
        env:
          OWNER: ${{ github.repository_owner }}
          INPUT_TAG: ${{ inputs.image_tag }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          owner="$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')"
          tag="$INPUT_TAG"
          if [[ -z "$tag" ]]; then tag="${COMMIT_SHA:0:12}"; fi
          if [[ ! "$tag" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "Invalid image tag." >&2
            exit 1
          fi
          echo "image=ghcr.io/$owner/bq-sqwad-ffmpeg-worker" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Build and publish worker image
        uses: docker/build-push-action@v6
        with:
          context: infra/video/ffmpeg-worker
          file: infra/video/ffmpeg-worker/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          labels: |
            org.opencontainers.image.title=BQ SQWAD TV FFmpeg worker
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report deployment boundary
        run: |
          echo "Container image published to GHCR."
          echo "This workflow does not start a persistent worker or connect Firestore/storage."
          echo "Configure an approved always-on container host and server-side credentials before processing queued movies."
