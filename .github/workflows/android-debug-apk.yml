name: Build Android Debug APK

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Public API Base URL"
        required: false
        default: "https://bqsqwad.com/api/public"
  push:
    branches:
      - main
    paths:
      - "android/**"
      - ".github/workflows/android-debug-apk.yml"

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Assemble Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Build Debug APK
        env:
          API_BASE_URL: ${{ github.event.inputs.api_base_url || 'https://bqsqwad.com/api/public' }}
        run: |
          gradle -p android :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK Generated
        run: |
          ls -lh android/app/build/outputs/apk/debug/ || exit 1

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bq-sqwad-tv-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
