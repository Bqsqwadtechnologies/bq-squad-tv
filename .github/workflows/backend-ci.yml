name: Backend and Website CI
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "docs/**"
      - "package.json"
      - "bun.lock"
      - "vite.config.ts"
      - "vitest.config.ts"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "src/**"
      - "docs/**"
      - "package.json"
      - "bun.lock"
      - "vite.config.ts"
      - "vitest.config.ts"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  website-and-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint -- --rule 'prettier/prettier: off'
      - name: Unit and API tests
        run: bunx vitest run
      - name: Build website and API
        run: bun run build
