name: Website and API CI
"on":
  push:
    branches:
      - main
  pull_request: {}
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  website-and-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # TanStack Router regenerates routeTree.gen.ts during the build. Build first
      # so the subsequent typecheck sees the complete current file-route registry.
      - name: Build website and API
        run: bun run build
      - name: TypeScript
        run: bun x tsc --noEmit
      - name: Lint
        run: 'bun run lint -- --rule "prettier/prettier: off"'
      - name: Unit and API tests
        run: bunx vitest run
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Reject Cloudflare runtime references
        shell: bash
        run: |
          if git grep -nEi '(cloudflare|wrangler|@cloudflare)' -- . ':!docs/**' ':!vite.config.ts' ':!.github/workflows/backend-ci.yml'; then
            echo "Forbidden Cloudflare runtime or dependency reference found." >&2
            exit 1
          fi
