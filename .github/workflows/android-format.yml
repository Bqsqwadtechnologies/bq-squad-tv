name: Android Kotlin Formatter

on:
  push:
    branches: [main]
    paths:
      - "android/.ktlint-format-trigger"

permissions:
  contents: write

concurrency:
  group: android-kotlin-format
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Format Kotlin sources
        run: |
          gradle -p android ktlintFormat
      - name: Commit formatting changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f android/.ktlint-format-trigger
          git add android/app/src android/app/build.gradle.kts
          if git diff --cached --quiet; then
            echo "No formatting changes."
            exit 0
          fi
          git commit -m "Format Android Kotlin sources"
          git push origin main
